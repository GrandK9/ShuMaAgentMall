spring:
  application:
    name: shumamall-agent
  config:
    import:
      # 必须写成 `optional:nacos:<dataId>.yaml`；裸写 `optional:nacos` 会被静默跳过
      # （ConfigDataLocationResolver.hasPrefix("nacos:") 返回 false）。
      - optional:nacos:shumamall-common.yaml
      # Agent 专属：仅放 LLM / embedding 的 api-key（真实凭据，不入代码仓库）。
      # 模板见 nacos-config/shumamall-agent.yaml，发布见 nacos-config/publish.ps1。
      - optional:nacos:shumamall-agent.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yaml
        # 不能用 public 命名空间：取不到配置的完整原因见 shumamall-comment/bootstrap.yml
        namespace: shumamall
      discovery:
        server-addr: localhost:8848

server:
  port: 8088
