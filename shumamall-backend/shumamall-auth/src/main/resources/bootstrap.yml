spring:
  application:
    name: shumamall-auth
  config:
    import:
      # 必须写成 `optional:nacos:<dataId>.yaml`；裸写 `optional:nacos` 会被静默跳过
      # （ConfigDataLocationResolver.hasPrefix("nacos:") 返回 false）。
      - optional:nacos:shumamall-common.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yaml
        # 不能用 public 命名空间：取不到配置的完整原因见 shumamall-comment/bootstrap.yml
        namespace: shumamall
      discovery:
        server-addr: localhost:8848

server:
  port: 8081

# 说明：原先此处及服务端 shumamall-auth.yaml 各有一份 JWT 密钥副本，现已删除。
# spring.config.import 导入的配置优先级低于本地文件，只要本地还留着副本，
# 配置中心下发的密钥就永远不会生效——那份"密钥统一由配置中心管理"的说法也就是假的。
# 密钥现在只有一处来源：Nacos shumamall 命名空间的 shumamall-common.yaml。
