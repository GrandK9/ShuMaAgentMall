spring:
  application:
    name: shumamall-product
  config:
    import:
      # 必须写成 `optional:nacos:<dataId>.yaml`；裸写 `optional:nacos` 会被静默跳过
      # （ConfigDataLocationResolver.hasPrefix("nacos:") 返回 false）。
      - optional:nacos:shumamall-common.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yaml
        # 不能用 public 命名空间：取不到配置的完整原因见 shumamall-comment/bootstrap.yml
        namespace: shumamall
      discovery:
        server-addr: localhost:8848
  datasource:
    url: jdbc:mysql://localhost:3306/shumamall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: shumamall
    password: shumamall123
    # ===== 生产者可靠投递 =====
    # correlated：发送时携带 CorrelationData，broker 的确认结果可关联回具体消息
    publisher-confirm-type: correlated
    # 消息到达交换机却无队列可路由时触发 returns 回调（收敛"消息静默消失"）
    publisher-returns: true
    template:
      # 无队列可路由时不静默丢弃，而是触发上面的 returns 回调
      mandatory: true

server:
  port: 8083

# ===== Seata 分布式事务（AT 模式，分支事务参与方）=====
# 被 order 调用扣库存时注册分支事务，并在同一库的 undo_log 记录反向补偿数据。
seata:
  application-id: ${spring.application.name}
  tx-service-group: shumamall_tx_group
  service:
    vgroup-mapping:
      shumamall_tx_group: default
    # 直连 TC，不经注册中心发现（原因见 shumamall-order/bootstrap.yml 同段注释）
    grouplist:
      default: 127.0.0.1:8091
  registry:
    type: file
  config:
    type: file
