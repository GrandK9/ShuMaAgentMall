spring:
  application:
    name: shumamall-video
  config:
    import:
      # 必须写成 `optional:nacos:<dataId>.yaml`；裸写 `optional:nacos` 会被静默跳过
      # （ConfigDataLocationResolver.hasPrefix("nacos:") 返回 false）。
      - optional:nacos:shumamall-common.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yaml
        # 不能用 public 命名空间：取不到配置的完整原因见 shumamall-comment/bootstrap.yml
        namespace: shumamall
      discovery:
        server-addr: localhost:8848
        # 不硬编码 ip：写死的 192.168.1.x 与本机实际地址不符，会把不可达地址
        # 注册进 Nacos 导致跨服务调用失败；留空由 Nacos 自动探测本机地址。
  data:
    mongodb:
      # 容器开启了 root 认证（见 docker-compose.yml 的 MONGO_INITDB_ROOT_*），
      # 必须带凭据并指定 authSource=admin，否则报 error 13 Unauthorized
      uri: mongodb://shumamall:shumamall123@localhost:27017/shumamall_video?authSource=admin
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

server:
  port: 8092

minio:
  endpoint: http://localhost:9000
  access-key: shumamall
  secret-key: shumamall123
  raw-bucket: shumamall-raw
  hls-bucket: video-hls
  thumb-bucket: video-thumb

video:
  ffprobe-path: ffprobe
  ffmpeg-path: ffmpeg
  task:
    max-seconds: 7200
  io:
    connect-timeout-seconds: 15
    read-idle-timeout-seconds: 120
    write-idle-timeout-seconds: 60
    download-max-seconds-admin: 1800
    download-max-seconds-comment: 300
    upload-object-max-seconds: 300
  transcode:
    pool-size: 2
    queue-capacity: 5
    ffprobe-timeout-seconds: 30
    hls-timeout-seconds-admin: 3600
    hls-timeout-seconds-comment: 300
    thumbnail-timeout-seconds: 30

# JWT 密钥不再本地兜底：spring.config.import 导入的配置优先级低于本地文件，
# 本地留副本会让配置中心下发的密钥永远不生效。唯一来源见 shumamall-common.yaml。
