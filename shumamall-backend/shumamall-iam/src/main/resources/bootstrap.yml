spring:
  application:
    name: shumamall-iam
  config:
    import:
      - optional:nacos:shumamall-common.yaml
  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        file-extension: yaml
        namespace: shumamall
      discovery:
        server-addr: localhost:8848
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          url: jdbc:mysql://localhost:3306/shumamall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
          username: root
          password: root123
          driver-class-name: com.mysql.cj.jdbc.Driver
        perm:
          url: jdbc:mysql://localhost:3306/shumamall_perm?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
          username: root
          password: root123
          driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
    mongodb:
      uri: mongodb://shumamall:shumamall123@localhost:27017/shumamall?authSource=admin
      auto-index-creation: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_id
  mapper-locations: classpath*:/mapper/**/*.xml

server:
  port: 8081

# 管理端上传（admin 模块）；Docker 用 MINIO_ENDPOINT / MINIO_PUBLIC_ENDPOINT 覆盖
minio:
  endpoint: http://localhost:9000
  public-endpoint: http://localhost:9000
  access-key: shumamall
  secret-key: shumamall123
  bucket: shumamall-raw
  public-bucket: shumamall-public
