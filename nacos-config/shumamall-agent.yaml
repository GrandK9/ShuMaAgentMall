# ============================================================
# shumamall-agent.yaml —— Agent 服务专属配置（Nacos 配置中心）
#
# dataId   : shumamall-agent.yaml
# group    : DEFAULT_GROUP
# namespace: shumamall
#
# 密钥占位符发布前替换；提示词与运行时参数可在控制台修改后「发布」触发热刷新
# （需 agent bootstrap 中 spring.cloud.nacos.config.refresh-enabled: true）。
#
# 占位符说明（prompts 模板）：
#   skill-router: {skillCatalog} {conversationContext} {userMessage}
#   planner: {skillId} {toolCatalog} {outputFormatExample} {plannerRules} {outputSchema} {conversationContext} {userMessage}
#   planner-rules 内可用 {maxSteps}
#   summary-user: {existingSummary} {fragment}
#   react-rethink-prefix: {userMessage}
# ============================================================

spring:
  ai:
    openai:
      api-key: "<DEEPSEEK_API_KEY>"

shumamall:
  agent:
    search:
      embedding:
        api-key: "<EMBEDDING_API_KEY>"

    memory:
      max-messages: 20
      ttl-minutes: 30
      summarize-enabled: true
      compress-after-rounds: 6
      keep-recent-messages: 8

    planning:
      max-steps: 15

    react:
      max-rounds: 2

    context:
      planning-max-messages: 12

    # prompts:  # 按需取消注释并填写；未配置项走代码内 AgentPromptDefaults
    #   skills:
    #     shopping_guide: |
    #       你是数码商城的智能导购助手…
    #   planner-rules: |
    #     - 步骤最多 {maxSteps} 步…
