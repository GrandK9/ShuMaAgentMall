# shumamall-product.yaml —— 商品聚合进程（商品 + 评论均 MySQL）可选覆盖
# dataId: shumamall-product.yaml / group: DEFAULT_GROUP / namespace: shumamall
# 本地 bootstrap 已含默认值；需要统一在配置中心改端口/数据源时再发布本文件。

server:
  port: 8083

spring:
  application:
    name: shumamall-product
  datasource:
    url: jdbc:mysql://localhost:3306/shumamall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true
